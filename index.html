<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Finder Egypt</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:#0044ff33;
filter:blur(150px);
top:-100px;
left:-100px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:#8b00ff33;
filter:blur(150px);
bottom:-100px;
right:-100px;
z-index:-1;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
border-bottom:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
}

.logo h1{
font-size:32px;
font-weight:900;
}

.logo p{
color:#aaa;
font-size:14px;
}

.toggle{
background:rgba(255,255,255,0.1);
border:none;
padding:12px 20px;
border-radius:15px;
color:white;
cursor:pointer;
transition:.3s;
}

.toggle:hover{
background:rgba(255,255,255,0.2);
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
display:grid;
grid-template-columns:350px 1fr;
gap:25px;
}

.sidebar{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
padding:25px;
border-radius:30px;
backdrop-filter:blur(20px);
height:fit-content;
position:sticky;
top:20px;
}

.sidebar h2{
margin-bottom:20px;
font-size:25px;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:8px;
color:#ccc;
}

.input-group input,
.input-group select{
width:100%;
padding:15px;
background:rgba(255,255,255,0.08);
border:none;
outline:none;
border-radius:15px;
color:white;
font-size:16px;
}

.input-group select option{
background:#111;
}

.search-btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(45deg,#0055ff,#8b00ff);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.search-btn:hover{
transform:scale(1.03);
}

.results{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:30px;
overflow:hidden;
backdrop-filter:blur(15px);
transition:.4s;
}

.card:hover{
transform:translateY(-8px);
border-color:#0055ff;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card-content h3{
font-size:24px;
margin-bottom:10px;
}

.badges{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.badge{
padding:8px 14px;
border-radius:30px;
font-size:14px;
background:#ffffff14;
}

.info{
margin:10px 0;
color:#ccc;
line-height:1.7;
}

.price{
margin-top:10px;
font-size:18px;
font-weight:bold;
color:#00ffae;
}

.location{
margin-top:8px;
color:#aaa;
}

.empty{
text-align:center;
padding:80px 20px;
font-size:25px;
color:#888;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.sidebar{
position:relative;
top:0;
}

}

</style>
</head>
<body>

<header>

<div class="logo">
<h1>Uni Finder Egypt</h1>
<p>اعرف الجامعة المناسبة لمجموعك</p>
</div>

<button class="toggle" onclick="toggleTheme()">🌙 الوضع</button>

</header>

<div class="container">

<div class="sidebar">

<h2>ابحث عن جامعتك</h2>

<div class="input-group">
<label>المجموع</label>
<input type="number" id="score" placeholder="مثال: 82">
</div>

<div class="input-group">
<label>الشعبة</label>
<select id="branch">
<option>علمي علوم</option>
<option>علمي رياضة</option>
<option>أدبي</option>
</select>
</div>

<div class="input-group">
<label>نوع الجامعة</label>
<select id="type">
<option>الكل</option>
<option>حكومية</option>
<option>خاصة</option>
<option>أهلية</option>
</select>
</div>

<div class="input-group">
<label>المدينة</label>
<select id="city">
<option>الكل</option>
<option>القاهرة</option>
<option>طنطا</option>
<option>العريش</option>
<option>6 أكتوبر</option>
</select>
</div>

<button class="search-btn" onclick="searchUniversities()">
عرض الجامعات
</button>

</div>

<div class="results" id="results"></div>

</div>

<script>

const universities = [

{
name:"جامعة القاهرة",
city:"القاهرة",
type:"حكومية",
faculty:"هندسة",
minScore:88,
fees:"1500 جنيه سنوياً",
image:"https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1200&auto=format&fit=crop",
details:"واحدة من أقوى الجامعات الحكومية في مصر وتتميز بقوة المناهج وفرص العمل.",
location:"الجيزة - القاهرة"
},

{
name:"جامعة عين شمس",
city:"القاهرة",
type:"حكومية",
faculty:"حاسبات ومعلومات",
minScore:84,
fees:"2000 جنيه سنوياً",
image:"https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1200&auto=format&fit=crop",
details:"متميزة في التكنولوجيا والذكاء الاصطناعي.",
location:"القاهرة"
},

{
name:"جامعة المستقبل",
city:"القاهرة",
type:"خاصة",
faculty:"طب أسنان",
minScore:78,
fees:"145000 جنيه سنوياً",
image:"https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1200&auto=format&fit=crop",
details:"جامعة خاصة حديثة بإمكانيات قوية.",
location:"القاهرة الجديدة"
},

{
name:"جامعة الملك سلمان",
city:"العريش",
type:"أهلية",
faculty:"هندسة",
minScore:74,
fees:"65000 جنيه سنوياً",
image:"https://images.unsplash.com/photo-1607237138185-eedd9c632b0b?q=80&w=1200&auto=format&fit=crop",
details:"جامعة أهلية حديثة بمستوى قوي.",
location:"العريش - شمال سيناء"
},

{
name:"جامعة طنطا",
city:"طنطا",
type:"حكومية",
faculty:"علوم",
minScore:75,
fees:"1200 جنيه سنوياً",
image:"https://images.unsplash.com/photo-1519452575417-564c1401ecc0?q=80&w=1200&auto=format&fit=crop",
details:"جامعة حكومية قوية في الدلتا.",
location:"طنطا - الغربية"
},

{
name:"جامعة مصر للعلوم والتكنولوجيا",
city:"6 أكتوبر",
type:"خاصة",
faculty:"إعلام",
minScore:65,
fees:"85000 جنيه سنوياً",
image:"https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?q=80&w=1200&auto=format&fit=crop",
details:"جامعة خاصة مشهورة وتضم كليات كثيرة.",
location:"مدينة 6 أكتوبر"
}

];

const results = document.getElementById('results');

function renderUniversities(data){

results.innerHTML='';

if(data.length===0){

results.innerHTML=`
<div class="empty">
لا توجد جامعات مناسبة لهذا المجموع
</div>
`;

return;
}

data.forEach(u=>{

results.innerHTML += `

<div class="card">

<img src="${u.image}">

<div class="card-content">

<h3>${u.name}</h3>

<div class="badges">
<div class="badge">${u.type}</div>
<div class="badge">${u.faculty}</div>
<div class="badge">${u.city}</div>
</div>

<div class="info">
${u.details}
</div>

<div class="info">
الحد الأدنى المتوقع: ${u.minScore}%
</div>

<div class="price">
${u.fees}
</div>

<div class="location">
📍 ${u.location}
</div>

</div>

</div>

`;

});

}

renderUniversities(universities);

function searchUniversities(){

const score = Number(document.getElementById('score').value || 0);
const type = document.getElementById('type').value;
const city = document.getElementById('city').value;

const filtered = universities.filter(u=>{

const scoreMatch = score >= u.minScore;
const typeMatch = type === 'الكل' || u.type === type;
const cityMatch = city === 'الكل' || u.city === city;

return scoreMatch && typeMatch && cityMatch;

});

renderUniversities(filtered);

}

function toggleTheme(){

document.body.classList.toggle('light');

if(document.body.classList.contains('light')){

document.body.style.background='#f2f2f2';
document.body.style.color='black';

}else{

document.body.style.background='#050505';
document.body.style.color='white';

}

}

</script>

</body>
</html>
