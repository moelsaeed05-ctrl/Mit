<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceWear - ملابس فضائية جريئة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }

        /* خلفية الفضاء المتحركة */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            z-index: -2;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: animateStars 50s linear infinite;
        }

        .stars::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.5) 50%, #000 100%);
            pointer-events: none;
        }

        @keyframes animateStars {
            from { transform: translateY(0px); }
            to { transform: translateY(-200px); }
        }

        /* الهيدر */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            margin: 0 2rem;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 50px 12px 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #4ecdc4;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .nav-icons {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-icons i {
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .nav-icons i:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff6b6b;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* القائمة الرئيسية */
        .categories {
            max-width: 1200px;
            margin: 100px auto 0;
            padding: 0 2rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            padding: 15px 30px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .category-btn:hover {
            background: rgba(78,205,196,0.3);
            border-color: #4ecdc4;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(78,205,196,0.3);
        }

        /* المنتجات */
        .products-section {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .section-title {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .product-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .product-card:hover::before {
            left: 100%;
        }

        .product-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: #4ecdc4;
            box-shadow: 0 20px 40px rgba(78,205,196,0.2);
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #4ecdc4;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 1rem;
        }

        .add-to-cart {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-to-cart:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(255,107,107,0.4);
        }

        /* سلة المشتريات */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .cart-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2rem;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .cart-total {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
            color: #4ecdc4;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* تسجيل الدخول */
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .auth-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2rem;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* الاستجابة للشاشات الصغيرة */
        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
                gap: 1rem;
            }
            
            .search-box {
                margin: 0;
                order: 3;
            }
            
            .categories {
                flex-direction: column;
                align-items: center;
            }
        }

        /* تأثيرات إضافية */
        .glow {
            box-shadow: 0 0 20px rgba(78,205,196,0.5);
        }
    </style>
</head>
<body>
    <!-- خلفية الفضاء -->
    <div class="stars-bg">
        <div class="stars"></div>
    </div>

    <!-- الهيدر -->
    <header class="header">
        <nav class="nav">
            <div class="logo">Space<span style="color: #4ecdc4;">Wear</span></div>
            <div class="search-box">
                <input type="text" placeholder="ابحث عن الملابس الفضائية..." id="searchInput">
                <i class="fas fa-search search-btn" onclick="searchProducts()"></i>
            </div>
            <div class="nav-icons">
                <i class="fas fa-user" onclick="toggleAuth()" title="تسجيل الدخول"></i>
                <i class="fas fa-shopping-cart" onclick="toggleCart()" title="سلة المشتريات">
                    <span class="cart-count" id="cartCount">0</span>
                </i>
            </div>
        </nav>
    </header>

    <!-- الأقسام -->
    <div class="categories">
        <a href="#hoodies" class="category-btn" onclick="filterProducts('hoodies')">هودي</a>
        <a href="#accessories" class="category-btn" onclick="filterProducts('accessories')">أكسسورات</a>
        <a href="#pants" class="category-btn" onclick="filterProducts('pants')">بناطيل</a>
        <a href="#all" class="category-btn active" onclick="filterProducts('all')">الكل</a>
    </div>

    <!-- قسم المنتجات -->
    <section class="products-section" id="productsSection">
        <h2 class="section-title" id="sectionTitle">كل المنتجات</h2>
    </section>

    <!-- سلة المشتريات -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <h3><i class="fas fa-shopping-cart"></i> سلة المشتريات</h3>
            <div id="cartItems"></div>
            <div class="cart-total" id="cartTotal">الإجمالي: 0 جنيه</div>
            <button class="checkout-btn" onclick="checkout()">إتمام الشراء</button>
            <button class="add-to-cart" onclick="toggleCart()" style="margin-top: 1rem;">إغلاق</button>
        </div>
    </div>

    <!-- تسجيل الدخول -->
    <div class="auth-modal" id="authModal">
        <div class="auth-content">
            <h3>تسجيل الدخول / التسجيل</h3>
            <form class="auth-form" onsubmit="handleAuth(event)">
                <input type="email" placeholder="البريد الإلكتروني" id="email">
                <input type="password" placeholder="كلمة المرور" id="password">
                <button type="submit" class="add-to-cart">دخول</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">ليس لديك حساب؟ <a href="#" onclick="toggleRegister()">إنشاء حساب</a></p>
        </div>
    </div>

    <script>
        // بيانات المنتجات
        const products = [
            { id: 1, name: 'هودي نجمي فضائي', price: 450, category: 'hoodies', img: 'https://images.unsplash.com/photo-1578933588905-f68d7a5a5f08?w=400' },
            { id: 2, name: 'هودي مجرة', price: 520, category: 'hoodies', img: 'https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=400' },
            { id: 3, name: 'ساعة فضائية LED', price: 280, category: 'accessories', img: 'https://images.unsplash.com/photo-1524592094714-0f25c5025c32?w=400' },
            { id: 4, name: 'نظارات شمسية كوزميك', price: 350, category: 'accessories', img: 'https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400' },
            { id: 5, name: 'بنطلون كارجو فضائي', price: 420, category: 'pants', img: 'https://images.unsplash.com/photo-1602293589930-66a0028f5cde?w=400' },
            { id: 6, name: 'بنطلون جلدي نجمي', price: 480, category: 'pants', img: 'https://images.unsplash.com/photo-1587563871167-1ee9c731aefb?w=400' },
            { id: 7, name: 'هودي نيون', price: 380, category: 'hoodies', img: 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400' },
                    { id: 8, name: 'بنطلون رياضي فضائي', price: 360, category: 'pants', img: 'https://images.unsplash.com/photo-1542272604-787c3835535d?w=400' }
        ];

        let cart = [];
        let currentFilter = 'all';

        // عرض المنتجات
        function displayProducts(productsToShow) {
            const productsSection = document.getElementById('productsSection');
            const sectionTitle = document.getElementById('sectionTitle');
            
            if (productsToShow.length === 0) {
                productsSection.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem;">
                        <i class="fas fa-search" style="font-size: 4rem; color: #4ecdc4; margin-bottom: 1rem;"></i>
                        <h2 style="font-size: 2rem; margin-bottom: 1rem;">لا توجد منتجات</h2>
                        <p>جرب البحث بكلمات أخرى أو غيّر الفلتر</p>
                    </div>
                `;
                return;
            }

            productsSection.innerHTML = `<h2 class="section-title" id="sectionTitle">${getSectionTitle()}</h2>`;
            
            productsToShow.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${product.img}" alt="${product.name}" class="product-img">
                    <h3 class="product-title">${product.name}</h3>
                    <div class="product-price">${product.price} جنيه</div>
                    <button class="add-to-cart" onclick="addToCart(${product.id})">
                        <i class="fas fa-cart-plus"></i> إضافة للسلة
                    </button>
                `;
                productsSection.appendChild(productCard);
            });
        }

        // فلترة المنتجات
        function filterProducts(category) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            let filteredProducts = products;
            if (category !== 'all') {
                filteredProducts = products.filter(p => p.category === category);
            }
            
            displayProducts(filteredProducts);
        }

        // البحث
        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(product => 
                product.name.toLowerCase().includes(query) || 
                product.category.toLowerCase().includes(query)
            );
            displayProducts(filtered);
        }

        // إضافة للسلة
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCartCount();
            showNotification('تم إضافة المنتج للسلة بنجاح! 🎉');
        }

        // تحديث عداد السلة
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // فتح/إغلاق سلة المشتريات
        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
            if (modal.style.display === 'block') displayCart();
        }

        // عرض محتويات السلة
        function displayCart() {
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #4ecdc4;">السلة فارغة 😔</p>';
                cartTotal.textContent = 'الإجمالي: 0 جنيه';
                return;
            }
            
            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.img}" alt="${item.name}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 10px;">
                    <div style="flex: 1;">
                        <h4>${item.name}</h4>
                        <p>${item.price} جنيه × ${item.quantity}</p>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button onclick="updateCartQuantity(${item.id}, -1)" style="background: #ff6b6b; border: none; color: white; padding: 5px 10px; border-radius: 5px;">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateCartQuantity(${item.id}, 1)" style="background: #4ecdc4; border: none; color: white; padding: 5px 10px; border-radius: 5px;">+</button>
                        <button onclick="removeFromCart(${item.id})" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 5px;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.textContent = `الإجمالي: ${total} جنيه`;
        }

        // تحديث كمية المنتج في السلة
        function updateCartQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    displayCart();
                    updateCartCount();
                }
            }
        }

        // حذف من السلة
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            displayCart();
            updateCartCount();
        }

        // إتمام الشراء
        function checkout() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            alert(`شكراً لك! تم إتمام الطلب بنجاح 💫\nالإجمالي: ${total} جنيه`);
            cart = [];
            updateCartCount();
            toggleCart();
        }

        // تسجيل الدخول
        function toggleAuth() {
            const modal = document.getElementById('authModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email && password) {
                showNotification('تم تسجيل الدخول بنجاح! 👋');
                toggleAuth();
                document.querySelector('.nav-icons .fa-user').title = 'مرحباً بك!';
            } else {
                alert('يرجى إدخال البيانات');
            }
        }

        function toggleRegister() {
            showNotification('سيتم إضافة صفحة التسجيل قريباً! ✨');
        }

        // عنوان القسم
        function getSectionTitle() {
            const titles = {
                'hoodies': 'هودي فضائية 🚀',
                'accessories': 'أكسسورات كونية ⭐',
                'pants': 'بناطيل مجرية 🌌',
                'all': 'كل المنتجات الفضائية'
            };
            return titles[currentFilter] || 'كل المنتجات';
        }

        // إشعارات
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 120px;
                right: 20px;
                background: linear-gradient(45deg, #4ecdc4, #45b7d1);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(78,205,196,0.4);
                z-index: 3000;
                font-weight: bold;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => document.body.removeChild(notification), 300);
            }, 3000);
        }

        // CSS للإشعارات
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // البحث عند الكتابة
        document.getElementById('searchInput').addEventListener('input', searchProducts);

        // إغلاق النوافذ عند الضغط خارجها
        window.onclick = function(event) {
            const cartModal = document.getElementById('cartModal');
            const authModal = document.getElementById('authModal');
            
            if (event.target === cartModal) toggleCart();
            if (event.target === authModal) toggleAuth();
        }

        // تحميل المنتجات عند بدء الصفحة
        displayProducts(products);
    </script>
</body>
</html>
