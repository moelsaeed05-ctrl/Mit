<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLT STORE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #101010;
    color: white;
}

header {
    height: 75px;
    padding: 0 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #181818;
    border-bottom: 1px solid #292929;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #ff7b00;
    letter-spacing: 2px;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

nav a:hover {
    color: #ff7b00;
}

.cart {
    background: #ff7b00;
    color: black;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.hero {
    min-height: 390px;
    padding: 70px 8%;
    display: flex;
    align-items: center;
    background: linear-gradient(110deg, #171717, #292018);
}

.hero-content {
    max-width: 550px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #ff7b00;
}

.hero p {
    color: #aaa;
    line-height: 1.9;
    margin-bottom: 25px;
}

.main-btn {
    background: #ff7b00;
    color: black;
    border: none;
    padding: 14px 28px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.section {
    padding: 55px 7%;
}

.section-title {
    font-size: 27px;
    margin-bottom: 25px;
}

.section-title span {
    color: #ff7b00;
}

.search-box {
    width: 100%;
    padding: 15px;
    background: #202020;
    border: 1px solid #333;
    color: white;
    border-radius: 8px;
    margin-bottom: 25px;
    outline: none;
}

.categories {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.categories button {
    padding: 10px 20px;
    background: #222;
    color: white;
    border: 1px solid #333;
    border-radius: 20px;
    cursor: pointer;
}

.categories button.active,
.categories button:hover {
    background: #ff7b00;
    color: black;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.product {
    background: #1c1c1c;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #292929;
    transition: .3s;
}

.product:hover {
    transform: translateY(-5px);
    border-color: #ff7b00;
}

.product-image {
    height: 190px;
    background: #292929;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 12px;
}

.price {
    color: #ff7b00;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 15px;
}

.add-btn {
    width: 100%;
    background: #ff7b00;
    border: none;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn:hover {
    background: #ff9633;
}

.cart-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: #000b;
    z-index: 20;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.cart-content {
    background: #202020;
    width: 100%;
    max-width: 450px;
    padding: 25px;
    border-radius: 12px;
    max-height: 80vh;
    overflow-y: auto;
}

.cart-content h2 {
    margin-bottom: 20px;
    color: #ff7b00;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #333;
    gap: 10px;
}

.remove-btn {
    color: #ff5555;
    background: none;
    border: none;
    cursor: pointer;
}

.close-btn {
    background: #333;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
    width: 100%;
}

.total {
    margin-top: 20px;
    font-size: 20px;
}

footer {
    background: #181818;
    text-align: center;
    padding: 30px;
    color: #888;
    margin-top: 50px;
}

@media(max-width: 900px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }

    nav {
        display: none;
    }

    .hero h1 {
        font-size: 36px;
    }
}

@media(max-width: 450px) {
    .products {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .product-image {
        height: 130px;
        font-size: 45px;
    }

    .product-info {
        padding: 12px;
    }

    .hero {
        padding: 55px 6%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">VOLT.</div>

    <nav>
        <a href="#">الرئيسية</a>
        <a href="#products">المنتجات</a>
        <a href="#about">من نحن</a>
    </nav>

    <button class="cart" onclick="openCart()">
        🛒 السلة (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>WELCOME TO <span>VOLT</span></h1>
        <p>
            اكتشف مجموعتنا المميزة من المنتجات والإكسسوارات
            بتصميم عصري وتجربة تسوق مختلفة.
        </p>
        <button class="main-btn"
        onclick="document.getElementById('products').scrollIntoView()">
            تسوق الآن
        </button>
    </div>
</section>

<section class="section" id="products">

    <h2 class="section-title">اكتشف <span>منتجاتنا</span></h2>

    <input
        type="text"
        class="search-box"
        id="search"
        placeholder="ابحث عن منتج..."
        oninput="renderProducts()"
    >

    <div class="categories">
        <button class="active" onclick="filterCategory('الكل',this)">الكل</button>
        <button onclick="filterCategory('ساعات',this)">ساعات</button>
        <button onclick="filterCategory('إكسسوارات',this)">إكسسوارات</button>
        <button onclick="filterCategory('موبايل',this)">موبايل</button>
    </div>

    <div class="products" id="productsContainer"></div>

</section>

<section class="section" id="about">
    <h2 class="section-title">ABOUT <span>VOLT</span></h2>
    <p style="color:#aaa;line-height:2">
        VOLT STORE وجهتك لاكتشاف المنتجات العصرية
        والإكسسوارات المميزة.
    </p>
</section>

<div class="cart-panel" id="cartPanel">
    <div class="cart-content">
        <h2>سلة المشتريات 🛒</h2>

        <div id="cartItems"></div>

        <div class="total">
            الإجمالي: <span id="total">0</span> جنيه
        </div>

        <button class="close-btn" onclick="closeCart()">
            إغلاق
        </button>
    </div>
</div>

<footer>
    © 2026 VOLT STORE - جميع الحقوق محفوظة
</footer>

<script>

const products = [
    {id:1,name:"ساعة كلاسيك",price:850,category:"ساعات",icon:"⌚"},
    {id:2,name:"ساعة رياضية",price:1200,category:"ساعات",icon:"⌚"},
    {id:3,name:"سلسلة ستانلس",price:250,category:"إكسسوارات",icon:"📿"},
    {id:4,name:"محفظة جلد",price:400,category:"إكسسوارات",icon:"👝"},
    {id:5,name:"سماعة لاسلكية",price:650,category:"موبايل",icon:"🎧"},
    {id:6,name:"جراب موبايل",price:180,category:"موبايل",icon:"📱"},
    {id:7,name:"نظارة شمسية",price:350,category:"إكسسوارات",icon:"🕶️"},
    {id:8,name:"سوار أنيق",price:220,category:"إكسسوارات",icon:"💍"}
];

let cart = [];
let currentCategory = "الكل";

function renderProducts() {

    const container = document.getElementById("productsContainer");
    const search = document.getElementById("search").value.toLowerCase();

    container.innerHTML = "";

    const filtered = products.filter(p => {
        return (
            (currentCategory === "الكل" || p.category === currentCategory)
            && p.name.toLowerCase().includes(search)
        );
    });

    filtered.forEach(p => {

        container.innerHTML += `
            <div class="product">
                <div class="product-image">${p.icon}</div>

                <div class="product-info">
                    <h3>${p.name}</h3>

                    <div class="price">${p.price} جنيه</div>

                    <button class="add-btn"
                    onclick="addToCart(${p.id})">
                        أضف إلى السلة +
                    </button>
                </div>
            </div>
        `;

    });

}

function filterCategory(category,button) {

    currentCategory = category;

    document.querySelectorAll(".categories button")
    .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    renderProducts();

}

function addToCart(id) {

    const product = products.find(p => p.id === id);

    const existing = cart.find(p => p.id === id);

    if(existing) {
        existing.quantity++;
    } else {
        cart.push({...product,quantity:1});
    }

    updateCart();

}

function updateCart() {

    let count = 0;
    let total = 0;

    cart.forEach(p => {
        count += p.quantity;
        total += p.price * p.quantity;
    });

    document.getElementById("cartCount").innerText = count;
    document.getElementById("total").innerText = total;

    const items = document.getElementById("cartItems");

    items.innerHTML = "";

    cart.forEach(p => {

        items.innerHTML += `
            <div class="cart-item">
                <div>
                    ${p.name}
                    <br>
                    ${p.price} × ${p.quantity}
                </div>

                <button class="remove-btn"
                onclick="removeFromCart(${p.id})">
                    حذف
                </button>
            </div>
        `;

    });

    if(cart.length === 0) {
        items.innerHTML = "<p>السلة فارغة حالياً</p>";
    }

}

function removeFromCart(id) {

    cart = cart.filter(p => p.id !== id);

    updateCart();

}

function openCart() {
    document.getElementById("cartPanel").style.display = "flex";
}

function closeCart() {
    document.getElementById("cartPanel").style.display = "none";
}

renderProducts();
updateCart();

</script>

</body>
</html>
