<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فيديو عرب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --accent: #e63946;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #888;
    --border: #2e2e2e;
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  header {
    background: #111;
    border-bottom: 2px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    flex: 1;
  }
  .logo span { color: var(--accent); }

  .header-icons {
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .header-icons svg {
    width: 22px; height: 22px;
    stroke: var(--text);
    fill: none;
    cursor: pointer;
    transition: stroke 0.2s;
  }
  .header-icons svg:hover { stroke: var(--accent); }

  .search-bar {
    background: var(--surface);
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .search-bar input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    direction: rtl;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }

  .tags {
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
    text-decoration: none;
  }
  .tag:hover, .tag.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .sort-bar {
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sort-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Cairo', sans-serif;
    transition: all 0.2s;
  }
  .sort-btn.active, .sort-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.2s, border-color 0.2s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }

  .thumb {
    position: relative;
    aspect-ratio: 16/9;
    background: var(--surface2);
    overflow: hidden;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }
  .card:hover .thumb img { transform: scale(1.05); }

  .badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .badge.hd { background: #1a6b3c; }
  .badge.new { background: #e63946; }

  .duration {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .card:hover .play-overlay { background: rgba(0,0,0,0.35); }
  .play-icon {
    width: 48px; height: 48px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.2s, transform 0.2s;
  }
  .card:hover .play-icon { opacity: 1; transform: scale(1); }
  .play-icon svg { width: 20px; height: 20px; fill: #fff; margin-right: -3px; }

  .card-body {
    padding: 10px 12px 12px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
  }
  .card-meta .likes {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #4caf50;
    font-weight: 600;
  }
  .card-meta .views {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-tags-mini {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 7px;
  }
  .tag-mini {
    background: var(--surface2);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px;
    color: var(--muted);
  }

  .pagination {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 24px 16px;
  }
  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--text);
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    transition: all 0.2s;
  }
  .page-btn.active, .page-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  footer {
    background: #111;
    border-top: 1px solid var(--border);
    padding: 20px 16px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
    .card-title { font-size: 12px; }
  }
</style>
</head>
