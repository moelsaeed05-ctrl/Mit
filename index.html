<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet iOS</title>

<style>
body {
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont;
  background: linear-gradient(135deg,#0f172a,#020617);
  color:white;
}

.screen {
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
  box-shadow: 0 0 15px rgba(0,255,150,0.08);
}

.balance {
  font-size:30px;
  color:#22c55e;
}

input,select {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#111827;
  color:white;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.deposit { background:#22c55e; }
.withdraw { background:#ef4444; }

.social button {
  background:#1f2937;
}

table {
  width:100%;
  margin-top:10px;
  font-size:13px;
}

td,th {
  padding:6px;
  text-align:center;
}

.action-btn {
  padding:5px 8px;
  font-size:12px;
  margin:2px;
}

.hidden { display:none; }
</style>
</head>

<body>

<div class="screen">

  <!-- LOGIN -->
  <div id="login" class="card">
    <h2>تسجيل الدخول</h2>
    <div class="social">
      <button onclick="login()">🔵 Google</button>
      <button onclick="login()">⚫ Apple</button>
      <button onclick="login()">🔷 Facebook</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <div class="card">
      <div class="balance" id="balance">0 جنيه</div>
      <input id="budget" type="number" placeholder="حدد حد الصرف">
    </div>

    <div class="card">
      <input id="amount" type="number" placeholder="المبلغ">
      <select id="source">
        <option>مرتب</option>
        <option>شغل</option>
        <option>هدية</option>
        <option>استثمار</option>
      </select>

      <button class="deposit" onclick="add()">إضافة</button>
      <button class="withdraw" onclick="withdraw()">سحب</button>
    </div>

    <div class="card">
      <select id="filterType" onchange="render()">
        <option value="all">الكل</option>
        <option value="دخل">دخل</option>
        <option value="مصروف">مصروف</option>
      </select>

      <input type="month" id="filterDate" onchange="render()">
    </div>

    <div class="card">
      <h3>📊 الإحصائيات</h3>
      <div id="stats"></div>
    </div>

    <div class="card">
      <h3>📜 العمليات</h3>
      <table>
        <thead>
          <tr>
            <th>نوع</th><th>مبلغ</th><th>مصدر</th><th>تاريخ</th><th>تحكم</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

  </div>

</div>

<script>
let balance = +localStorage.balance || 0;
let data = JSON.parse(localStorage.data || "[]");
let budget = +localStorage.budget || 0;

function login(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
}

function save(){
  localStorage.balance = balance;
  localStorage.data = JSON.stringify(data);
  localStorage.budget = budgetInput.value;
  render();
}

function add(){
  let amount = +amountInput.value;
  if(!amount) return;

  balance += amount;
  data.push({type:"دخل",amount,source:sourceInput.value,date:new Date()});
  save();
}

function withdraw(){
  let amount = +amountInput.value;
  if(!amount || amount>balance) return;

  balance -= amount;
  data.push({type:"مصروف",amount,source:sourceInput.value,date:new Date()});
  save();
}

function deleteItem(i){
  data.splice(i,1);
  save();
}

function editItem(i){
  let newAmount = prompt("عدل المبلغ", data[i].amount);
  if(!newAmount) return;
  data[i].amount = +newAmount;
  save();
}

function render(){
  balanceEl.innerText = balance + " جنيه";

  let type = filterType.value;
  let month = filterDate.value;

  list.innerHTML = "";

  let income=0,expense=0;

  data.forEach((t,i)=>{
    let d = new Date(t.date);

    if(type!="all" && t.type!=type) return;
    if(month && d.toISOString().slice(0,7)!=month) return;

    if(t.type=="دخل") income+=t.amount;
    else expense+=t.amount;

    list.innerHTML += `
    <tr>
      <td>${t.type}</td>
      <td>${t.amount}</td>
      <td>${t.source}</td>
      <td>${d.toLocaleDateString()}</td>
      <td>
        <button class="action-btn" onclick="editItem(${i})">✏️</button>
        <button class="action-btn" onclick="deleteItem(${i})">🗑️</button>
      </td>
    </tr>`;
  });

  stats.innerText = 
  "دخل: "+income+" | مصروف: "+expense+
  (budgetInput.value ? " | الحد: "+budgetInput.value : "");
}

let amountInput = document.getElementById("amount");
let sourceInput = document.getElementById("source");
let balanceEl = document.getElementById("balance");
let list = document.getElementById("list");
let stats = document.getElementById("stats");
let filterType = document.getElementById("filterType");
let filterDate = document.getElementById("filterDate");
let budgetInput = document.getElementById("budget");

budgetInput.value = budget;

render();
</script>

</body>
</html>
