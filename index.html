<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Dark</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#020617;
  color:white;
}

.app{
  max-width:420px;
  margin:auto;
  padding-bottom:80px;
}

/* HEADER */
.header{
  padding:20px;
  text-align:center;
}

.balance{
  font-size:28px;
  font-weight:bold;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:15px;
  margin:10px;
}

/* TRANSACTIONS */
.item{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}

/* BUTTON FLOAT */
.add-btn{
  position:fixed;
  bottom:90px;
  right:20px;
  width:60px;
  height:60px;
  background:#22c55e;
  border-radius:50%;
  font-size:30px;
  text-align:center;
  line-height:60px;
  cursor:pointer;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:420px;
  background:#020617;
  display:flex;
  justify-content:space-around;
  padding:10px;
  border-top:1px solid #111;
}

.nav div{
  text-align:center;
  font-size:12px;
  cursor:pointer;
}

/* HIDE */
.hidden{display:none;}

input,select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#111;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
}

</style>
</head>

<body>

<div class="app">

<!-- WALLET -->
<div id="wallet">

<div class="header">
  <div id="month">أبريل 2026</div>
  <div class="balance" id="balance">EGP 0</div>
  <div class="row">
    <span id="income">دخل: 0</span>
    <span id="expense">مصروف: 0</span>
  </div>
</div>

<div class="card">
  <h3>المعاملات الأخيرة</h3>
  <div id="list"></div>
</div>

</div>

<!-- ANALYTICS -->
<div id="analytics" class="hidden">
  <div class="header">
    <h2>📊 التحليلات</h2>
  </div>

  <div class="card">
    <div id="stats"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="hidden">
  <div class="header">
    <h2>⚙️ الإعدادات</h2>
  </div>

  <div class="card">
    <input id="budget" placeholder="حد الصرف">
    <button onclick="saveBudget()">حفظ</button>
  </div>
</div>

<!-- ADD -->
<div id="addScreen" class="hidden">
  <div class="card">
    <input id="amount" placeholder="المبلغ">
    <select id="type">
      <option>دخل</option>
      <option>مصروف</option>
    </select>
    <select id="source">
      <option>مرتب</option>
      <option>شغل</option>
      <option>هدية</option>
    </select>
    <button onclick="add()">حفظ</button>
  </div>
</div>

</div>

<div class="add-btn" onclick="openAdd()">+</div>

<div class="nav">
  <div onclick="nav('wallet')">💼<br>المحفظة</div>
  <div onclick="nav('analytics')">📊<br>تحليلات</div>
  <div onclick="nav('settings')">⚙️<br>إعدادات</div>
</div>

<script>
let balance=+localStorage.balance||0;
let data=JSON.parse(localStorage.data||"[]");

function nav(page){
  wallet.classList.add("hidden");
  analytics.classList.add("hidden");
  settings.classList.add("hidden");
  addScreen.classList.add("hidden");
  document.getElementById(page).classList.remove("hidden");
}

function openAdd(){
  nav("addScreen");
}

function add(){
  let amount=+amountInput.value;
  let type=typeInput.value;

  if(!amount)return;

  if(type=="دخل") balance+=amount;
  else balance-=amount;

  data.push({
    amount,type,
    source:sourceInput.value,
    date:new Date()
  });

  save();
}

function save(){
  localStorage.balance=balance;
  localStorage.data=JSON.stringify(data);
  nav("wallet");
  render();
}

function render(){
  balanceEl.innerText="EGP "+balance;

  let income=0,expense=0;
  list.innerHTML="";

  data.slice().reverse().forEach(t=>{
    if(t.type=="دخل") income+=t.amount;
    else expense+=t.amount;

    list.innerHTML+=`
    <div class="item">
      <span>${t.type}</span>
      <span>${t.amount}</span>
    </div>`;
  });

  incomeEl.innerText="دخل: "+income;
  expenseEl.innerText="مصروف: "+expense;
  stats.innerText="دخل: "+income+" | مصروف: "+expense;
}

let amountInput=document.getElementById("amount");
let typeInput=document.getElementById("type");
let sourceInput=document.getElementById("source");

let balanceEl=document.getElementById("balance");
let list=document.getElementById("list");
let incomeEl=document.getElementById("income");
let expenseEl=document.getElementById("expense");

render();
</script>

</body>
</html>
